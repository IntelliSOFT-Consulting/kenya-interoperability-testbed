volumes:
   gitb-repo:
   gitb-dbdata:
   itbKenyaHapi:

services:

   # ---------------------------
   # GITB SERVICES
   # ---------------------------

   # Every service also answers to a lab-* network alias (e.g. gitb-srv ->
   # lab-service). New config refers to services by alias; service names stay
   # because the GITB images find each other by their default hostnames.
   gitb-redis:
      image: isaitb/gitb-redis
      container_name: itb-redis
      restart: unless-stopped
      networks:
        default:
          aliases:
            - lab-cache

   gitb-mysql:
      image: isaitb/gitb-mysql
      container_name: itb-mysql
      restart: unless-stopped
      environment:
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      volumes:
        - gitb-dbdata:/var/lib/mysql
      healthcheck:
        test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
        interval: 3s
        retries: 50
      networks:
        default:
          aliases:
            - lab-db

   gitb-srv:
      image: isaitb/gitb-srv
      container_name: itb-srv
      restart: unless-stopped
      environment:
        - CALLBACK_ROOT_URL=http://localhost:8080
        - HMAC_KEY=${HMAC_KEY}
      ports:
        - "8080:8080"
      networks:
        default:
          aliases:
            - lab-service

   gitb-ui:
      image: isaitb/gitb-ui
      container_name: itb-ui
      restart: unless-stopped
      expose:
        - "9000"
      environment:
        - THEME=ec
        - AUTOMATION_ENABLED=true
        - TESTBED_HOME_LINK=${TESTBED_HOME_LINK:-http://localhost:9000/}
        - AUTHENTICATION_COOKIE_PATH=/
        - WEB_CONTEXT_ROOT=/
        - DB_DEFAULT_PASSWORD=${DB_DEFAULT_PASSWORD}
        - HMAC_KEY=${HMAC_KEY}
        - APPLICATION_SECRET=${APPLICATION_SECRET}
        - MASTER_PASSWORD=${MASTER_PASSWORD}
      volumes:
        - gitb-repo:/gitb-repository
      depends_on:
        gitb-redis:
          condition: service_started
        gitb-mysql:
          condition: service_healthy
        gitb-srv:
          condition: service_started
      networks:
        default:
          aliases:
            - lab-ui

   # Fronts gitb-ui on the host-facing port 9000 and strips its vendor footer
   # links (User guide / REST API / Find out more / version) via sub_filter —
   # those are compiled into gitb-ui's own template, no config switch exists.
   gitb-ui-proxy:
      image: nginx:alpine
      container_name: itb-ui-proxy
      restart: unless-stopped
      ports:
        - "9000:80"
      volumes:
        - ./nginx/gitb-ui-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        gitb-ui:
          condition: service_started
      networks:
        default:
          aliases:
            - lab-ui-proxy


   # ---------------------------
   # HAPI FHIR SERVER
   # ---------------------------

   hapi-fhir-kenyaitb:
      image: hapiproject/hapi:v8.10.0-3
      container_name: hapi-fhir-kenyaitb
      user: "0:0"
      restart: unless-stopped
      ports:
        - "8086:8080"
      volumes:
        - itbKenyaHapi:/data/hapi
      environment:
        - hapi.fhir.fhir_version=R4
        - hapi.fhir.allow_external_references=true
        - hapi.fhir.allow_multiple_delete=true
        - hapi.fhir.reuse_cached_search_results_millis=60000
        - spring.datasource.url=jdbc:h2:file:/data/hapi/h2database
        - spring.datasource.driverClassName=org.h2.Driver
        - spring.datasource.username=sa
        - spring.datasource.password=null
      networks:
        default:
          aliases:
            - lab-fhir

   # ---------------------------
   # MOCK HIE (DHA AfyaConnect middleware stand-in)
   # ---------------------------
   # Replaced by the local UAT services later by changing the ITB domain
   # parameter hieBaseUrl; the test cases never reference this host directly.
   mock-hie:
      image: wiremock/wiremock:3.9.1
      container_name: mock-hie
      restart: unless-stopped
      command: ["--disable-banner"]
      ports:
        - "8095:8080"
      volumes:
        - ./mock-hie:/home/wiremock

   # ---------------------------
   # LAB GATEWAY (EMR entry point)
   # ---------------------------
   # Run scripts/init-lab-gateway.sh once before the first start.
   lab-gateway:
      image: nginx:1.27-alpine
      container_name: lab-gateway
      restart: unless-stopped
      ports:
        - "9010:80"
      volumes:
        - ./nginx/lab-gateway.conf:/etc/nginx/conf.d/default.conf:ro
        - ./nginx/lab-gateway-receive.inc:/etc/nginx/snippets/lab-gateway-receive.inc:ro
        - ./nginx/lab-gateway-vendor.inc:/etc/nginx/snippets/lab-gateway-vendor.inc:ro
        - ./nginx/lab:/etc/nginx/lab:ro
      depends_on:
        gitb-srv:
          condition: service_started
