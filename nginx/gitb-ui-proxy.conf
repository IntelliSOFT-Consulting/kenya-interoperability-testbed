server {
    listen 80;

    location / {
        proxy_pass http://gitb-ui:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gitb-ui must serve uncompressed HTML for sub_filter to be able to
        # rewrite it — sub_filter cannot see inside a gzip-compressed body.
        proxy_set_header Accept-Encoding "";

        # Hides the vendor footer links (User guide / REST API / Find out
        # more / version number) that are compiled into gitb-ui's own
        # server-rendered template — there's no supported config switch for
        # this, so it's done here rather than forking gitb-ui's source.
        sub_filter '</head>' '<style>.footer-link{display:none !important;}</style></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
